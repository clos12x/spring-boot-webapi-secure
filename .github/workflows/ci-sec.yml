name: CI - Spring Boot DevSecOps

on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # 3. SCA
  # Dependency-Check se ejecutará en el workflow Nightly.
  # Se mantiene aquí desactivado para que el CI de feature sea más rápido.
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Static Analysis - SpotBugs + PMD
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis - SpotBugs + PMD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn -B clean compile

      - name: Run SpotBugs
        run: |
          mvn -B \
              com.github.spotbugs:spotbugs-maven-plugin:4.10.4.1:spotbugs \
              -Dspotbugs.xmlOutput=true \
              -Dspotbugs.htmlOutput=true

      - name: Run PMD
        continue-on-error: true
        run: |
          mvn -B org.apache.maven.plugins:maven-pmd-plugin:pmd

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugs*.xml
            target/reports/spotbugs.html
            target/pmd.xml
            target/site/pmd.html
          if-no-files-found: warn
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Quality Gate
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sast-codeql
      - static-analysis
    if: always()

    steps:
      - name: Check previous job results
        run: |
          echo "=========================================="
          echo "          DEVSECOPS QUALITY GATE"
          echo "=========================================="

          echo "Build & Test:     ${{ needs.build-and-test.result }}"
          echo "CodeQL:           ${{ needs.sast-codeql.result }}"
          echo "Static Analysis:  ${{ needs.static-analysis.result }}"

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            exit 1
          fi

          if [[ "${{ needs.sast-codeql.result }}" != "success" ]]; then
            echo "::error::CodeQL security analysis failed"
            exit 1
          fi

          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "::error::SpotBugs/static analysis failed"
            exit 1
          fi

          echo "=========================================="
          echo "QUALITY GATE PASSED"
          echo "=========================================="